[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader_api = "0.11"
crossbeam-queue = { version = "0.3.14", default-features = false, features = ["alloc"] }
font8x8 = { version = "0.3.1", default-features = false }
linked_list_allocator = "0.10.6"
pc-keyboard = "0.9.0"
pic8259 = "0.11.0"
spin = "0.12.3"
x86_64 = "0.15.5"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
